<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Pessoal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #FFDCA8;
            color: #D90000;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #ffbb00;
        }

        main {
            background-color: #D90000;
            color: #FFDCA8;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #f1a282;
        }

        main img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 16px auto;
        }
        img {
    width: 80px;
    height: 80px;
}
    </style>
</head>

<body>
    <header>
        <h1>Minha página pessoal</h1>
        <p>Minhas experiências no vôlei</p>
    </header>
    <main>
        <img src="imagem-01.png" alt="Uma ilustração em estilo de desenho à mão de uma bola de vôlei clássica, centralizada num quadrado. A bola é composta por painéis de cor creme (#FFDCA8) e contornada com traços rústicos e expressivos em vermelho (#D90000). O fundo tem uma textura de papel antigo, com uma borda branca desgastada. A imagem não contém texto e está em formato 1:1.">
    
        <h2>As primeiras impressões</h2>
        <p>Bem-vindos! Aqui vou compartilhar minhas primeiras impressões sobre o vôlei</p>
        <p>Por: Caio Felipe</p>
        <button>🏐 <span>0</span></button>
        
    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

    function botaoClicado() {
        console.log("fui cliado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>
</html>
